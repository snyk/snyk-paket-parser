version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1

executors:
  docker-node:
    parameters:
      version:
        default: '22'
        type: string
    docker:
      - image: cimg/node:<<parameters.version>>

commands:
  install:
    steps:
      - run:
          name: Install
          command: npm ci

  test:
    steps:
      - run:
          name: Test
          command: npm test

  release:
    steps:
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@25.0.3

  lint:
    steps:
      - run:
          name: Lint
          command: npm run lint

jobs:
  security-scans:
    resource_class: small
    docker:
      - image: cimg/node:22
    steps:
      - checkout
      - run:
          name: Install
          command: npm ci
      - prodsec/security_scans:
          mode: auto
          release-branch: master
          open-source-additional-arguments: --exclude=test
          iac-scan: disabled

  test:
    resource_class: small
    parameters:
      version:
        default: '22'
        type: string
    executor:
      name: docker-node
      version: <<parameters.version>>
    steps:
      - checkout
      - install
      - test

  lint:
    resource_class: small
    executor:
      name: docker-node
    steps:
      - checkout
      - install
      - lint

  release:
    resource_class: small
    executor:
      name: docker-node
    steps:
      - checkout
      - install
      - release

workflows:
  version: 2
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-vuln-alerts-sca-scanners
          filters:
            branches:
              ignore:
                - master
      - security-scans:
          name: Security Scans
          context:
            - engines_sca-scanners
            - prodsec-orb-runtime
      - lint:
          name: Lint
          filters:
            branches:
              ignore:
                - master
      - test:
          requires:
            - Lint
            - Scan repository for secrets
            - Security Scans
          matrix:
            parameters:
              version:
                - '22'
                - '24'
                - '26'
      - release:
          context:
            - nodejs-install
            - github-release
          requires:
            - test
          filters:
            branches:
              only:
                - master
